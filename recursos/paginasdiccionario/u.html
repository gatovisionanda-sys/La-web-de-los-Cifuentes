<hr>

<div style="padding: 20px;">

<h2 class="entradilla">Uuuuuuuuu</h2>
<p class="desc">
Utilizado para sorprenderse de manera positiva sobre algo de alguien, ya sea un objeto, un hecho, o un acontecimiento.
En ciertos casos, se puede complementar con un "charo" al final.
<br><br>
Ejemplos:<br>
- ¿Que te vas de viaje? Uuuuuuuuu.<br>
- ¿A ver los zapatos? Uuuuuuuuu chaaaro.
</p>
